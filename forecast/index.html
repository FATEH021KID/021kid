<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پیش‌بینی ۷ روزه | آب‌وهوای بین‌المللی</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
padding:20px;
background:#081018;
color:#fff;
font-family:Tahoma,Arial,sans-serif;
}

h1{
text-align:center;
margin:10px 0 5px;
}

.sub{
text-align:center;
color:#9aa8b5;
margin-bottom:25px;
}

#forecast{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:15px;
max-width:1100px;
margin:auto;
}

.card{
background:#151f29;
border:1px solid #293746;
border-radius:20px;
padding:18px;
box-shadow:0 8px 25px #0008;
}

.card h2{
margin:0 0 5px;
}

.date{
color:#8999a8;
font-size:13px;
}

.icon{
font-size:42px;
margin:12px 0;
}

.temp{
font-size:27px;
font-weight:bold;
margin-bottom:15px;
}

.temp span{
font-size:16px;
color:#8fa0af;
}

.info{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.info div{
background:#0e161e;
padding:10px;
border-radius:10px;
font-size:13px;
}

.info small{
display:block;
color:#7f91a0;
margin-bottom:5px;
}
</style>
</head>

<body>

<h1>🌤️ پیش‌بینی ۷ روز آینده</h1>

<div class="sub">
آب‌وهوای بین‌المللی
</div>

<div id="forecast"></div>

<script>
const box=document.getElementById("forecast");
const lat=29.6,lon=52.5;
const days=["شنبه","یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه","جمعه"];

function direction(deg){
 const d=["شمال","شمال‌شرق","شرق","جنوب‌شرق","جنوب","جنوب‌غرب","غرب","شمال‌غرب"];
 return d[Math.round(deg/45)%8];
}

async function loadForecast(){
 box.innerHTML="<div style="text-align:center;padding:40px">⏳ در حال دریافت اطلاعات واقعی هواشناسی...</div>";
 try{
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,relative_humidity_2m_mean,wind_speed_10m_max,wind_direction_10m_dominant,uv_index_max,sunrise,sunset&timezone=auto&forecast_days=7`;
  const r=await fetch(url);
  if(!r.ok) throw new Error("خطا در دریافت اطلاعات");
  const x=await r.json();
  const w=x.daily;
  box.innerHTML="";
  for(let i=0;i<7;i++){
   const d=new Date(w.time[i]+"T12:00:00");
   const date=new Intl.DateTimeFormat("fa-IR-u-ca-persian",{day:"numeric",month:"long"}).format(d);
   const code=w.weather_code[i];
   const status=weatherText(code);
   const sunrise=new Date(w.sunrise[i]).toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"});
   const sunset=new Date(w.sunset[i]).toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"});
   box.innerHTML+=`<div class="card"><h2>${days[i]}</h2><div class="date">${date}</div><div class="icon">${status.split(" ")[0]}</div><div class="temp">${Math.round(w.temperature_2m_max[i])}° <span>/ ${Math.round(w.temperature_2m_min[i])}°</span></div><div class="info"><div><small>وضعیت</small>${status}</div><div><small>احتمال بارش</small>${w.precipitation_probability_max[i]??"--"}٪</div><div><small>رطوبت</small>${Math.round(w.relative_humidity_2m_mean[i])}٪</div><div><small>سرعت باد</small>${Math.round(w.wind_speed_10m_max[i])} km/h</div><div><small>جهت باد</small>${direction(w.wind_direction_10m_dominant[i])}</div><div><small>شاخص UV</small>${Math.round(w.uv_index_max[i]*10)/10}</div><div><small>طلوع</small>${sunrise}</div><div><small>غروب</small>${sunset}</div></div></div>`;
  }
 }catch(e){
  box.innerHTML=`<div style="text-align:center;padding:40px">❌ ${e.message}</div>`;
 }
}

function weatherText(code){
 const list={0:"☀️ صاف",1:"🌤️ عمدتاً صاف",2:"⛅ کمی ابری",3:"☁️ ابری",45:"🌫️ مه",48:"🌫️ مه یخ‌زن",51:"🌦️ نم‌نم باران",53:"🌦️ بارش خفیف",55:"🌧️ بارش",61:"🌧️ باران",63:"🌧️ باران متوسط",65:"🌧️ باران شدید",71:"🌨️ برف",73:"🌨️ برف متوسط",75:"❄️ برف شدید",80:"🌦️ رگبار",81:"🌦️ رگبار متوسط",82:"⛈️ رگبار شدید",95:"⛈️ رعدوبرق",96:"⛈️ رعدوبرق و تگرگ",99:"⛈️ رعدوبرق و تگرگ شدید"};
 return list[code]||"🌤️ نامشخص";
}
loadForecast();
</script>

</body>
</html>
