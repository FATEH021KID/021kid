<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پیش‌بینی ۷ روزه | آب‌وهوای بین‌المللی</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
padding:20px;
background:#081018;
color:#fff;
font-family:Tahoma,Arial,sans-serif;
}

h1{
text-align:center;
margin:10px 0 5px;
}

.sub{
text-align:center;
color:#9aa8b5;
margin-bottom:25px;
}

#forecast{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:15px;
max-width:1100px;
margin:auto;
}

.card{
background:#151f29;
border:1px solid #293746;
border-radius:20px;
padding:18px;
box-shadow:0 8px 25px #0008;
}

.card h2{
margin:0 0 5px;
}

.date{
color:#8999a8;
font-size:13px;
}

.icon{
font-size:42px;
margin:12px 0;
}

.temp{
font-size:27px;
font-weight:bold;
margin-bottom:15px;
}

.temp span{
font-size:16px;
color:#8fa0af;
}

.info{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.info div{
background:#0e161e;
padding:10px;
border-radius:10px;
font-size:13px;
}

.info small{
display:block;
color:#7f91a0;
margin-bottom:5px;
}
</style>
</head>

<body>

<h1>🌤️ پیش‌بینی ۷ روز آینده</h1>

<div class="sub">
آب‌وهوای بین‌المللی
</div>

<div id="forecast"></div>

<script>

const box = document.getElementById("forecast");

const days = [
"شنبه",
"یکشنبه",
"دوشنبه",
"سه‌شنبه",
"چهارشنبه",
"پنجشنبه",
"جمعه"
];

for(let i = 0; i < 7; i++){

    const d = new Date();

    d.setDate(d.getDate() + i + 1);

    const date = new Intl.DateTimeFormat(
        "fa-IR-u-ca-persian",
        {
            day:"numeric",
            month:"long"
        }
    ).format(d);

    box.innerHTML += `

    <div class="card">

        <h2>${days[i]}</h2>

        <div class="date">
            ${date}
        </div>

        <div class="icon">
            🌤️
        </div>

        <div class="temp">
            --° <span>/ --°</span>
        </div>

        <div class="info">

            <div>
                <small>وضعیت</small>
                --
            </div>

            <div>
                <small>احتمال بارش</small>
                --٪
            </div>

            <div>
                <small>رطوبت</small>
                --٪
            </div>

            <div>
                <small>سرعت باد</small>
                -- km/h
            </div>

            <div>
                <small>جهت باد</small>
                --
            </div>

            <div>
                <small>شاخص UV</small>
                --
            </div>

            <div>
                <small>طلوع</small>
                --
            </div>

            <div>
                <small>غروب</small>
                --
            </div>

        </div>

    </div>

    `;
}

</script>

</body>
</html>
