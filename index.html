<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>آب‌وهوای بین‌المللی</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;font-family:Tahoma,Arial,sans-serif}#map{position:fixed;inset:0}.top{position:fixed;z-index:1000;top:12px;left:12px;right:12px;display:flex;gap:8px;justify-content:center}.top input{width:min(420px,70%);padding:13px;border:0;border-radius:13px;background:#101820ee;color:white;outline:0}.top button{border:0;border-radius:13px;padding:0 18px;background:#1677ff;color:#fff;font-weight:bold}.title{position:fixed;z-index:1000;top:72px;left:12px;background:#101820ee;color:white;padding:10px 14px;border-radius:13px;font-weight:bold}.panel{position:fixed;z-index:1001;top:12px;right:12px;width:min(430px,calc(100% - 24px));max-height:calc(100% - 90px);overflow:auto;background:#101820f5;color:white;border-radius:18px;padding:14px;display:none;box-shadow:0 10px 35px #000b}.back{width:100%;padding:11px;border:0;border-radius:11px;background:#293746;color:white;font-weight:bold;margin-bottom:12px}.current{text-align:center;border-bottom:1px solid #3b4b58;padding-bottom:14px}.temp{font-size:46px;font-weight:bold}.desc{font-size:18px;margin:5px}.small{font-size:12px;color:#c4d0d8;line-height:2}.days{display:grid;gap:8px;margin-top:10px}.day{background:#18242e;border-radius:13px;padding:12px}.day b{font-size:15px}.loading{text-align:center;padding:30px}.date{position:fixed;z-index:1000;bottom:10px;left:10px;right:10px;text-align:center;background:#101820e8;color:white;border:1px solid #30404d;border-radius:14px;padding:7px;font-size:11px;line-height:1.7}@media(max-width:600px){.title{top:72px;font-size:13px}.panel{top:110px;max-height:calc(100% - 165px)}.top input{width:65%}}</style></head><body><div id="map"></div><div class="top"><input id="city" placeholder="نام شهر را جستجو کن..."><button id="searchBtn">جستجو</button></div><div class="title">🌍 آب‌وهوای بین‌المللی</div><div id="panel" class="panel"><button id="back" class="back">← برگشت به نقشه</button><div id="weather"></div></div><div class="date"><div id="pdate"></div><div id="clock"></div><div id="gdate"></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map("map",{worldCopyJump:true}).setView([25,45],3);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map);let marker=null;const panel=document.getElementById("panel"),weather=document.getElementById("weather");const code={0:"صاف",1:"اکثراً صاف",2:"نیمه‌ابری",3:"ابری",45:"مه",48:"مه یخ‌زن",51:"نم‌نم باران",53:"باران خفیف",55:"باران",56:"نم‌نم یخ‌زن",57:"باران یخ‌زن",61:"باران خفیف",63:"باران متوسط",65:"باران شدید",66:"باران یخ‌زن",67:"باران یخ‌زن شدید",71:"برف خفیف",73:"برف متوسط",75:"برف شدید",77:"دانه‌های برف",80:"رگبار خفیف",81:"رگبار متوسط",82:"رگبار شدید",85:"رگبار برف",86:"رگبار برف شدید",95:"رعدوبرق",96:"رعدوبرق و تگرگ",99:"رعدوبرق شدید"};function wind(d){return["شمال","شمال‌شرق","شرق","جنوب‌شرق","جنوب","جنوب‌غرب","غرب","شمال‌غرب"][Math.round(d/45)%8]}function dateFa(s){return new Intl.DateTimeFormat("fa-IR-u-ca-persian",{weekday:"long",day:"numeric",month:"long"}).format(new Date(s+"T12:00:00"))}async function weatherAt(lat,lon,name){if(marker)map.removeLayer(marker);marker=L.marker([lat,lon]).addTo(map).bindPopup((name||"موقعیت انتخاب‌شده")+"<br>"+lat.toFixed(4)+", "+lon.toFixed(4)).openPopup();panel.style.display="block";weather.innerHTML="<div class=loading>⏳ در حال دریافت پیش‌بینی واقعی هوا...</div>";try{const u="https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+"&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_direction_10m,is_day&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,relative_humidity_2m_mean,wind_speed_10m_max,uv_index_max,sunrise,sunset&timezone=auto&forecast_days=7";const r=await fetch(u);if(!r.ok)throw Error();const x=await r.json(),c=x.current,d=x.daily;let h="<div class=current><h2>"+(name||"موقعیت انتخاب‌شده")+"</h2><div class=small>📍 "+lat.toFixed(4)+" ، "+lon.toFixed(4)+"</div><div class=temp>"+Math.round(c.temperature_2m)+"°C</div><div class=desc>"+(code[c.weather_code]||"نامشخص")+"</div><div class=small>🌡️ احساس دما: "+Math.round(c.apparent_temperature)+"°C<br>💧 رطوبت: "+c.relative_humidity_2m+"٪<br>🌧️ بارش فعلی: "+c.precipitation+" mm<br>💨 باد: "+Math.round(c.wind_speed_10m)+" km/h، "+wind(c.wind_direction_10m)+"</div></div><h3>📅 پیش‌بینی ۷ روزه</h3><div class=days>";for(let i=0;i<7;i++)h+="<div class=day><b>"+dateFa(d.time[i])+"</b><br>"+(code[d.weather_code[i]]||"نامشخص")+"<br>🌡️ "+Math.round(d.temperature_2m_max[i])+"° / "+Math.round(d.temperature_2m_min[i])+"°C<div class=small>🌧️ احتمال بارش: "+(d.precipitation_probability_max[i]??0)+"٪<br>💦 مجموع بارش: "+(d.precipitation_sum[i]??0)+" mm<br>💧 میانگین رطوبت: "+Math.round(d.relative_humidity_2m_mean[i])+"٪<br>💨 حداکثر باد: "+Math.round(d.wind_speed_10m_max[i])+" km/h<br>☀️ UV: "+Math.round(d.uv_index_max[i]??0)+"<br>🌅 طلوع: "+new Date(d.sunrise[i]).toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"})+" | 🌇 غروب: "+new Date(d.sunset[i]).toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"})+"</div></div>";weather.innerHTML=h+"</div>"}catch(e){weather.innerHTML="<div class=loading>❌ دریافت داده‌های هواشناسی ناموفق بود.<br><span class=small>اتصال اینترنت یا سرویس هواشناسی را بررسی کن.</span></div>"}}map.on("click",e=>weatherAt(e.latlng.lat,e.latlng.lng,"موقعیت انتخاب‌شده"));document.getElementById("back").onclick=()=>{panel.style.display="none";if(marker){map.removeLayer(marker);marker=null}};async function searchCity(){const q=document.getElementById("city").value.trim();if(!q)return;try{const r=await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(q)+"&count=1&language=fa&format=json");const x=await r.json();if(!x.results?.length)return alert("شهر پیدا نشد");const p=x.results[0];map.setView([p.latitude,p.longitude],10);weatherAt(p.latitude,p.longitude,p.name+(p.country?"، "+p.country:""))}catch(e){alert("خطا در جستجوی شهر")}}document.getElementById("searchBtn").onclick=searchCity;document.getElementById("city").onkeydown=e=>{if(e.key==="Enter")searchCity()};function clock(){const n=new Date();document.getElementById("pdate").textContent=new Intl.DateTimeFormat("fa-IR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(n);document.getElementById("clock").textContent="🕐 "+n.toLocaleTimeString("fa-IR");document.getElementById("gdate").textContent=new Intl.DateTimeFormat("en-US",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(n)}clock();setInterval(clock,1000)</script></body></html>
