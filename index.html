<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>آب‌وهوای بین‌المللی</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;font-family:Tahoma,Arial,sans-serif}#map{position:fixed;inset:0}#title{position:fixed;z-index:1000;top:14px;left:14px;background:#101820ee;color:#fff;padding:12px 16px;border-radius:14px;font-weight:bold}#search{position:fixed;z-index:1000;top:70px;left:14px;display:flex;gap:6px;width:min(390px,calc(100% - 28px))}#city{flex:1;padding:12px;border:1px solid #394957;border-radius:12px;background:#101820ee;color:#fff}#searchBtn{border:0;border-radius:12px;padding:12px 16px;background:#247cff;color:#fff}#weather{position:fixed;z-index:1001;top:14px;right:14px;width:min(410px,calc(100% - 28px));max-height:calc(100% - 110px);overflow:auto;background:#101820f7;color:#fff;border-radius:18px;padding:15px;display:none;box-shadow:0 8px 30px #0009}#back{width:100%;border:0;border-radius:12px;padding:11px;background:#293746;color:#fff;font-weight:bold;margin-bottom:12px}.current{text-align:center;border-bottom:1px solid #394957;padding-bottom:13px}.temp{font-size:42px;font-weight:bold}.small{font-size:12px;color:#c0ccd5;line-height:1.9}.days{display:grid;gap:8px;margin-top:10px}.day{background:#18232d;border-radius:12px;padding:11px}#dateBar{position:fixed;z-index:1000;bottom:12px;left:12px;right:12px;background:#101820e8;color:#fff;border:1px solid #293746;border-radius:15px;padding:8px;text-align:center;font-size:12px;line-height:1.7}
</style>
</head>
<body>
<div id="map"></div>
<div id="title">🌍 آب‌وهوای بین‌المللی</div>
<div id="search"><input id="city" placeholder="جستجوی شهر..."><button id="searchBtn">جستجو</button></div>
<div id="weather"><button id="back">← برگشت به نقشه</button><div id="weatherContent"></div></div>
<div id="dateBar"><div id="persianDate"></div><div id="clock"></div><div id="gregorianDate"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map("map").setView([32,53],5);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map);
let marker=null;
const panel=document.getElementById("weather"),box=document.getElementById("weatherContent");
const codes={0:"صاف",1:"اکثراً صاف",2:"نیمه‌ابری",3:"ابری",45:"مه",48:"مه یخ‌زن",51:"نم‌نم باران",53:"باران خفیف",55:"باران",61:"باران خفیف",63:"باران متوسط",65:"باران شدید",71:"برف خفیف",73:"برف",75:"برف شدید",80:"رگبار",81:"رگبار متوسط",82:"رگبار شدید",95:"رعدوبرق",96:"رعدوبرق و تگرگ",99:"رعدوبرق شدید"};
function wind(d){return["شمال","شمال‌شرق","شرق","جنوب‌شرق","جنوب","جنوب‌غرب","غرب","شمال‌غرب"][Math.round(d/45)%8]}
function faDate(s){return new Intl.DateTimeFormat("fa-IR-u-ca-persian",{weekday:"long",day:"numeric",month:"long"}).format(new Date(s+"T12:00:00"))}
function selectPoint(lat,lon,name){
if(marker)map.removeLayer(marker);
marker=L.marker([lat,lon]).addTo(map).bindPopup((name||"موقعیت")+"<br>مختصات: "+lat.toFixed(4)+", "+lon.toFixed(4)).openPopup();
panel.style.display="block";
box.innerHTML="<div style=text-align:center>⏳ در حال دریافت آب‌وهوا...</div>";
const url="https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+"&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_direction_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,relative_humidity_2m_mean,wind_speed_10m_max,uv_index_max,sunrise,sunset&timezone=auto&forecast_days=7";
fetch(url).then(r=>{if(!r.ok)throw Error();return r.json()}).then(x=>{
const c=x.current,d=x.daily;
let h="<div class=current><h2>"+(name||"موقعیت انتخاب‌شده")+"</h2><div class=small>📍 "+lat.toFixed(4)+" ، "+lon.toFixed(4)+"</div><div class=temp>"+Math.round(c.temperature_2m)+"°C</div><div>"+(codes[c.weather_code]||"نامشخص")+"</div><div class=small>احساس دما: "+Math.round(c.apparent_temperature)+"°C<br>💧 رطوبت: "+c.relative_humidity_2m+"٪ | 🌧️ بارش: "+c.precipitation+" mm<br>💨 باد: "+Math.round(c.wind_speed_10m)+" km/h، "+wind(c.wind_direction_10m)+"</div></div><div class=days>";
for(let i=0;i<7;i++){h+="<div class=day><b>"+faDate(d.time[i])+"</b> · "+(codes[d.weather_code[i]]||"")+"<br>🌡️ "+Math.round(d.temperature_2m_max[i])+"° / "+Math.round(d.temperature_2m_min[i])+"°C<div class=small>🌧️ احتمال بارش: "+d.precipitation_probability_max[i]+"٪ | 💧 رطوبت: "+Math.round(d.relative_humidity_2m_mean[i])+"٪<br>💨 باد تا "+Math.round(d.wind_speed_10m_max[i])+" km/h | ☀️ UV: "+Math.round(d.uv_index_max[i])+"</div></div>"}
box.innerHTML=h+"</div>";
}).catch(()=>box.innerHTML="<div style=text-align:center>❌ دریافت اطلاعات آب‌وهوا ناموفق بود.</div>");
}
map.on("click",e=>selectPoint(e.latlng.lat,e.latlng.lng,"موقعیت انتخاب‌شده"));
document.getElementById("back").onclick=()=>{panel.style.display="none";if(marker){map.removeLayer(marker);marker=null}};
function searchCity(){
const q=document.getElementById("city").value.trim();if(!q)return;
fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(q)+"&count=1&language=fa&format=json").then(r=>r.json()).then(x=>{if(!x.results?.length)return alert("شهر پیدا نشد");const p=x.results[0];map.setView([p.latitude,p.longitude],10);selectPoint(p.latitude,p.longitude,p.name+(p.country?"، "+p.country:""))}).catch(()=>alert("خطا در جستجوی شهر"));
}
document.getElementById("searchBtn").onclick=searchCity;
document.getElementById("city").addEventListener("keydown",e=>{if(e.key==="Enter")searchCity()});
function updateDate(){const n=new Date();document.getElementById("persianDate").textContent=new Intl.DateTimeFormat("fa-IR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(n);document.getElementById("clock").textContent="🕐 "+n.toLocaleTimeString("fa-IR");document.getElementById("gregorianDate").textContent=new Intl.DateTimeFormat("en-US",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(n)}
updateDate();setInterval(updateDate,1000);
</script>
</body>
</html>
