<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>آب‌وهوای بین‌المللی</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Tahoma,Arial;background:#081018}#map{position:absolute;inset:0}#title{position:absolute;z-index:1000;top:15px;left:15px;background:#101820ee;color:#fff;padding:12px 18px;border-radius:14px;font-weight:bold}#search{position:absolute;z-index:1000;top:75px;left:15px;display:flex;gap:6px;width:min(400px,calc(100% - 30px))}#search input{flex:1;padding:12px;border:1px solid #394957;border-radius:12px;background:#101820ee;color:#fff}#search button{border:0;border-radius:12px;padding:12px;background:#247cff;color:#fff}#weather{position:absolute;z-index:1000;top:130px;right:15px;width:min(390px,calc(100% - 30px));max-height:calc(100% - 230px);overflow:auto;background:#101820f2;color:#fff;border-radius:16px;padding:15px;box-shadow:0 8px 30px #0009}.current{text-align:center;border-bottom:1px solid #394957;padding-bottom:12px}.temp{font-size:38px;font-weight:bold}.days{display:grid;gap:8px;margin-top:10px}.day{background:#18232d;border-radius:12px;padding:10px}.day b{font-size:15px}.small{font-size:12px;color:#b8c5cf;line-height:1.8}#dateBar{position:absolute;z-index:1000;bottom:15px;left:15px;right:15px;background:#101820e8;color:#fff;border:1px solid #293746;border-radius:16px;padding:10px;text-align:center;box-shadow:0 5px 20px #0008}.leaflet-popup-content{direction:rtl;text-align:right}@media(max-width:600px){#weather{top:125px;max-height:calc(100% - 210px)}#title{font-size:14px}}
</style>
</head>
<body>
<div id="map"></div>
<div id="title">🌍 آب‌وهوای بین‌المللی</div>
<div id="search"><input id="city" placeholder="جستجوی شهر..."><button id="searchBtn">جستجو</button></div>
<div id="weather">نقطه‌ای روی نقشه انتخاب کنید.</div>
<div id="dateBar"><div id="persianDate"></div><div id="clock"></div><div id="gregorianDate"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map("map",{worldCopyJump:true}).setView([32,53],5);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
let marker=null;
const weatherBox=document.getElementById("weather");
const codeText={0:"صاف",1:"اکثراً صاف",2:"نیمه‌ابری",3:"ابری",45:"مه",48:"مه یخ‌زن",51:"نم‌نم باران",53:"باران خفیف",55:"باران",61:"باران خفیف",63:"باران متوسط",65:"باران شدید",71:"برف خفیف",73:"برف",75:"برف شدید",80:"رگبار",81:"رگبار متوسط",82:"رگبار شدید",95:"رعدوبرق",96:"رعدوبرق و تگرگ",99:"رعدوبرق شدید"};
function windDir(d){return["شمال","شمال‌شرق","شرق","جنوب‌شرق","جنوب","جنوب‌غرب","غرب","شمال‌غرب"][Math.round(d/45)%8]}
function faDate(x){return new Intl.DateTimeFormat("fa-IR-u-ca-persian",{weekday:"long",day:"numeric",month:"long"}).format(new Date(x+"T12:00"))}
function weather(lat,lon,name){
weatherBox.innerHTML="⏳ در حال دریافت آب‌وهوا...";
const url="https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+"&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_direction_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,relative_humidity_2m_mean,wind_speed_10m_max,uv_index_max,sunrise,sunset&timezone=auto&forecast_days=7";
fetch(url).then(r=>r.json()).then(x=>{
const c=x.current,d=x.daily;
let html="<div class=current><h2>"+(name||"موقعیت انتخاب‌شده")+"</h2><div class=temp>"+Math.round(c.temperature_2m)+"°C</div><div>"+(codeText[c.weather_code]||"نامشخص")+"</div><div class=small>احساس واقعی: "+Math.round(c.apparent_temperature)+"°C<br>رطوبت: "+c.relative_humidity_2m+"٪ | بارش: "+c.precipitation+" mm<br>باد: "+Math.round(c.wind_speed_10m)+" km/h، "+windDir(c.wind_direction_10m)+"</div></div><div class=days>";
for(let i=0;i<7;i++)html+="<div class=day><b>"+faDate(d.time[i])+"</b> 🌤️ "+(codeText[d.weather_code[i]]||"")+
"<div>"+Math.round(d.temperature_2m_max[i])+"° / "+Math.round(d.temperature_2m_min[i])+"°C</div><div class=small>احتمال بارش: "+d.precipitation_probability_max[i]+"٪ | رطوبت: "+Math.round(d.relative_humidity_2m_mean[i])+"٪<br>باد تا "+Math.round(d.wind_speed_10m_max[i])+" km/h | شاخص UV: "+Math.round(d.uv_index_max[i])+"</div></div>";
weatherBox.innerHTML=html+"</div>";
}).catch(()=>weatherBox.innerHTML="❌ دریافت اطلاعات آب‌وهوا ناموفق بود.");
}
function selectPoint(lat,lon,name){
if(marker)map.removeLayer(marker);
marker=L.marker([lat,lon]).addTo(map).bindPopup(name||"موقعیت انتخاب‌شده").openPopup();
weather(lat,lon,name);
}
map.on("click",e=>selectPoint(e.latlng.lat,e.latlng.lng,"موقعیت انتخاب‌شده"));
function searchCity(){
const name=document.getElementById("city").value.trim();
if(!name)return;
fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(name)+"&count=1&language=fa&format=json").then(r=>r.json()).then(x=>{
if(!x.results?.length)return alert("شهر پیدا نشد");
const p=x.results[0];
map.setView([p.latitude,p.longitude],10);
selectPoint(p.latitude,p.longitude,p.name+(p.country?"، "+p.country:""));
}).catch(()=>alert("خطا در جستجو"));
}
document.getElementById("searchBtn").onclick=searchCity;
document.getElementById("city").addEventListener("keydown",e=>{if(e.key==="Enter")searchCity()});
function updateDate(){
const n=new Date();
document.getElementById("persianDate").textContent=new Intl.DateTimeFormat("fa-IR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(n);
document.getElementById("clock").textContent="🕐 "+n.toLocaleTimeString("fa-IR");
document.getElementById("gregorianDate").textContent=new Intl.DateTimeFormat("en-US",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(n);
}
updateDate();setInterval(updateDate,1000);
weather(32,53,"ایران");
</script>
</body>
</html>
